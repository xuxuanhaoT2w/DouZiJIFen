name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure production D1 binding
        run: sed -i "s/00000000-0000-4000-8000-000000000000/$D1_DATABASE_ID/g" dist/server/wrangler.json
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Set PUBG API key
        if: env.PUBG_API_KEY != ''
        run: printf '%s' "$PUBG_API_KEY" | npx wrangler secret put PUBG_API_KEY --config dist/server/wrangler.json
      - name: Deploy worker
        run: npx wrangler deploy --config dist/server/wrangler.json
